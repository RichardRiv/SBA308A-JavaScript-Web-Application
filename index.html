<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Anime Search!</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400;1,700&family=Domine:wght@400..700&family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./styles.css" />
		<script type="module" src="./script.js"></script>
	</head>
	<body>
		<div class="container">
			<div class="outer-box">
				<div class="title-search">
					<h1>Search for Anime!</h1>
					<form id="searchAnimeForm">
						<div>
							<input type="search" name="searchInput" minlength="3" required />
							<button type="submit" name="searchBtn">Search!</button>
						</div>
					</form>
				</div>
				<div id="animeBox" class="anime-box"></div>
			</div>
		</div>
	</body>
</html>
